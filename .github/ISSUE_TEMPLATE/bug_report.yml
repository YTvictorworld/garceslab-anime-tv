name: Bug report
description: Something in Garceslab Anime doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is the Garceslab Anime tracker. Please don't report Garceslab Anime problems to Seanime or Seanime Tenji.
        Don't paste passwords, API keys, tokens, IP addresses or your server's address, and check screenshots for private data.
        Every fix starts from an issue like this one; the pull request will reference it with "Closes #N".
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (Settings, or the .ipk file name), your TV model and webOS version, and the server version.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Where does it happen?
      options:
        - LG webOS TV app
        - Web interface
        - Server / Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which screen, which remote keys. The steps help us write the regression test that every fix must include.
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or photos of the TV
      description: Optional. Remove names, addresses and tokens first.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with secrets removed.
      render: text
