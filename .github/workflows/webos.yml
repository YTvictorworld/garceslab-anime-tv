name: webOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipk:
    name: Tests and webOS .ipk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - run: npm test
      # EXPO_PUBLIC_TV_TIME_ZONE is a local build option and is not set here:
      # the app uses the TV's own time zone.
      - run: npm run build:webos
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: dist/webos/*.ipk
          if-no-files-found: error

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner
